<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B3F94">
    <title>Turmas – TFinder</title>
    <script>document.documentElement.dataset.bsTheme = localStorage.getItem("tf_tema") || "light";</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-pagina="turmas" data-admin="1">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-pc-display-horizontal"></i> TFinder</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menu"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-house"></i> Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservas.html"><i class="bi bi-calendar-check"></i> Reservas</a></li>
                    <li class="nav-item"><a class="nav-link" href="locais.html"><i class="bi bi-building"></i> Locais</a></li>
                    <li class="nav-item"><a class="nav-link" href="recursos.html"><i class="bi bi-pc-display"></i> Equipamentos</a></li>
                    <li class="nav-item"><a class="nav-link" href="notificacoes.html"><i class="bi bi-bell"></i> Avisos<span id="badge" class="badge bg-success ms-1 d-none"></span></a></li>
                    <li class="nav-item so-admin"><a class="nav-link" href="usuarios.html"><i class="bi bi-people"></i> Usuários</a></li>
                    <li class="nav-item so-admin"><a class="nav-link active" href="turmas.html"><i class="bi bi-mortarboard"></i> Turmas</a></li>
                    <li class="nav-item so-admin"><a class="nav-link" href="relatorios.html"><i class="bi bi-bar-chart"></i> Relatórios</a></li>
                </ul>
                <div class="d-flex flex-wrap align-items-center gap-2 mt-3 mt-lg-0">
                    <div id="quem"></div>
                    <button class="btn btn-outline-light btn-sm" id="btn-tema" onclick="alternarTema()"><i class="bi bi-moon-stars"></i> Modo escuro</button>
                    <button class="btn btn-success btn-sm" onclick="sair()"><i class="bi bi-box-arrow-right"></i> Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="pagina-cab d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <h1>Turmas e Classes</h1>
                <p>Gerencie as turmas escolares que utilizam os equipamentos e laboratórios.</p>
            </div>
        </div>

        <form id="f-crud" class="card p-3 p-md-4 mb-4 so-admin">
            <input type="hidden" name="__id">
            <h2 class="h5 mb-3 d-flex align-items-center gap-2" id="crud-titulo">
                <i class="bi bi-mortarboard text-primary"></i> Nova turma
            </h2>
            <div class="row g-3">
                <div class="col-12 col-md-5">
                    <label class="form-label">Identificação da Turma</label>
                    <input class="form-control" type="text" name="nome" placeholder="Ex.: 3º Ano A - Informática" required autocomplete="off">
                </div>
                <div class="col-6 col-md-4">
                    <label class="form-label">Turno das Aulas</label>
                    <select class="form-select" name="turno">
                        <option>Manhã</option>
                        <option>Tarde</option>
                        <option>Noite</option>
                        <option>Integral</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label">Ano Letivo</label>
                    <input class="form-control" type="number" name="ano_letivo" placeholder="2026" autocomplete="off" min="2020" max="2100">
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary" type="submit" id="crud-salvar"><i class="bi bi-check-lg"></i> Salvar Turma</button>
                <button class="btn btn-outline-secondary d-none" type="button" id="crud-cancelar">Cancelar edição</button>
            </div>
        </form>

        <div class="barra-ferramentas">
            <div class="busca">
                <i class="bi bi-search"></i>
                <input class="form-control" id="busca" placeholder="Pesquisar por turma, turno ou ano...">
            </div>
        </div>

        <div class="card card-tabela">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 tabela-cartoes">
                    <thead>
                        <tr>
                            <th>Turma</th>
                            <th>Turno</th>
                            <th>Ano Letivo</th>
                            <th class="text-end so-admin">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="linhas"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="avisos" class="position-fixed top-0 end-0 p-3" style="z-index: 2000; width: min(380px, 100%);"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/comum.js"></script>
    <script src="js/crud.js"></script>
    <script src="js/turmas.js"></script>
</body>
</html>
