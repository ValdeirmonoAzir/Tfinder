<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B3F94">
    <title>Criar conta – TFinder</title>
    <script>document.documentElement.dataset.bsTheme = localStorage.getItem("tf_tema") || "light";</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-publica="1">
    <div class="auth-grade">
        <aside class="auth-marca">
            <div class="auth-logo-claro"><i class="bi bi-pc-display-horizontal"></i> TFinder</div>
            <h2>Reserve computadores e TVs sem conflito de horário.</h2>
            <ul>
                <li><i class="bi bi-calendar-check"></i> Veja a disponibilidade em tempo real</li>
                <li><i class="bi bi-building"></i> Encontre os equipamentos de cada laboratório</li>
                <li><i class="bi bi-bell"></i> Receba avisos sobre suas reservas</li>
            </ul>
        </aside>
        <section class="auth-form">
            <button class="btn btn-sm btn-outline-secondary tema-flutuante" onclick="alternarTema()">Modo escuro</button>
            <div class="auth-caixa">
                <div class="auth-logo"><i class="bi bi-pc-display-horizontal"></i> TFinder</div>
                <h2 class="h4 mb-1">Criar conta</h2>
                <p class="text-secondary mb-4">Preencha seus dados para acessar o sistema.</p>
                <form id="f-cadastro">
                    <input class="form-control mb-3" name="nome" placeholder="Nome completo" required>
                    <input class="form-control mb-3" type="email" name="email" placeholder="E-mail" inputmode="email" required pattern="[^@\s]+@[^@\s]+\.[^@\s]{2,}" maxlength="120" title="Informe um e-mail válido, como nome@dominio.com">
                    <input class="form-control mb-3" type="email" name="email2" placeholder="Confirme o e-mail" inputmode="email" required pattern="[^@\s]+@[^@\s]+\.[^@\s]{2,}" maxlength="120" title="Informe um e-mail válido, como nome@dominio.com">
                    <div class="row g-3 mb-3">
                        <div class="col-6"><input class="form-control" name="matricula" placeholder="Matrícula" required></div>
                        <div class="col-6"><input class="form-control" name="telefone" type="tel" placeholder="Telefone"></div>
                    </div>
                    <select class="form-select mb-3" name="tipo"><option>Aluno</option><option>Professor</option></select>
                    <input class="form-control mb-4" type="password" name="senha" placeholder="Senha (mín. 6 caracteres)" autocomplete="new-password" required minlength="6">
                    <button class="btn btn-success w-100" type="submit">Cadastrar</button>
                    <a class="d-block mt-3 small" href="login.html">Já tenho conta</a>
                </form>
            </div>
        </section>
    </div>
    <div id="avisos" class="position-fixed top-0 end-0 p-3" style="z-index: 2000; width: min(380px, 100%);"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/comum.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
